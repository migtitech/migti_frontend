name: Sync Secrets to migtitech01

on:
  workflow_dispatch:

jobs:
  sync-frontend-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || (
            curl -sSL https://github.com/cli/cli/releases/download/v2.65.0/gh_2.65.0_linux_amd64.tar.gz -o /tmp/gh.tar.gz &&
            tar -xzf /tmp/gh.tar.gz -C /tmp &&
            sudo mv /tmp/gh_2.65.0_linux_amd64/bin/gh /usr/local/bin/gh
          )
          gh --version

      - name: Copy frontend secrets
        env:
          GH_TOKEN: ${{ secrets.MIGTITECH01_SYNC_TOKEN }}
          TARGET: migtitech01/migti_frontend
          DEV_API_URL: ${{ secrets.DEV_API_URL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          for key in DEV_API_URL SERVER_HOST SERVER_PASSWORD SERVER_USER; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "Skipping empty secret: $key"
              continue
            fi
            printf '%s' "$value" | gh secret set "$key" -R "$TARGET" -b-
            echo "Synced $key"
          done
