name: Sync Secrets to migtitech01

on:
  workflow_dispatch:

jobs:
  export-frontend-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Export secrets artifact
        env:
          DEV_API_URL: ${{ secrets.DEV_API_URL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          keys = ["DEV_API_URL", "SERVER_HOST", "SERVER_PASSWORD", "SERVER_USER"]
          data = {k: os.environ.get(k, "") for k in keys}
          with open("frontend-secrets.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          PY

      - name: Upload secrets bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-secrets-bundle
          path: frontend-secrets.json
          retention-days: 1
