name: Build and Deploy to Development Server 

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install -f

      # 🔥 Inject ENV from GitHub Secrets
      - name: Create .env file
        run: |
          echo "REACT_APP_API_URL=${{ secrets.DEV_API_URL }}" >> .env

      - name: Build
        run: npm run build

      - name: Archive Build
        run: tar -czf build.tar.gz build package.json

      - name: Copy Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "build.tar.gz"
          target: "/var/www/migtidev/migti_frontend"

      - name: Deploy on Server (Extract + Clean)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/migtidev/migti_frontend

            rm -rf build
            tar -xzf build.tar.gz
            rm -f build.tar.gz

            echo "✅ Deployment completed"