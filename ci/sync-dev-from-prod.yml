sync-dev-from-prod:
  stage: pre-sync
  tags:
    - migti-prod
    - linux
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev_indore"
    - if: $CI_COMMIT_BRANCH == "dev_noida"
  variables:
    GIT_STRATEGY: none
  script:
    - rm -rf "/migti/ci-sync/${CI_PROJECT_PATH//\//_}"
    - bash /migti/ci-scripts/sync-branches.sh prod "${CI_COMMIT_BRANCH}"
