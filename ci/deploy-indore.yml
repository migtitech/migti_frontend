migti-indore-deploy:
  stage: deploy
  tags:
    - migti-prod
    - linux
  rules:
    - if: $CI_COMMIT_BRANCH == "migti_indore"
  variables:
    GIT_STRATEGY: none
    DEPLOY_PATH: /migti/migti_frontend
    DEPLOY_BRANCH: migti_indore
  script:
    - cd "${DEPLOY_PATH}" && bash ci/deploy-frontend.sh
