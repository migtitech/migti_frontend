dev-indore-deploy:
  stage: deploy
  tags:
    - migti-prod
    - linux
  rules:
    - if: $CI_COMMIT_BRANCH == "dev_indore"
  needs:
    - job: sync-dev-from-prod
      optional: true
  variables:
    GIT_STRATEGY: none
    DEPLOY_PATH: /migti/dev/indore/migti_frontend
    DEPLOY_BRANCH: dev_indore
  script:
    - cd "${DEPLOY_PATH}" && bash ci/deploy-frontend.sh
